<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complete Your Payment</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #f5f5f5; margin: 0; }
    .container { max-width: 420px; margin: 40px auto; background: white; padding: 28px; border-radius: 14px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
    h2 { margin-top: 0; text-align: center; }
    label { display: block; margin: 14px 0 4px; font-weight: 600; font-size: 14px; }
    input, button { width: 100%; padding: 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
    button { background: #0d5f2f; color: white; font-weight: 700; border: none; cursor: pointer; margin-top: 20px; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }

    .screen { display: none; text-align: center; }
    .screen.active { display: block; }

    .spinner { width: 44px; height: 44px; border: 4px solid #e0e0e0; border-top-color: #0d5f2f; border-radius: 50%; margin: 24px auto; animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .icon-circle { width: 64px; height: 64px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 12px auto 20px; font-size: 32px; }
    .icon-success { background: #e6f7ee; color: #0ca678; }
    .icon-fail { background: #ffecec; color: #fa5252; }

    p.sub { color: #666; font-size: 14px; margin-top: 8px; }
    .amount { font-size: 28px; font-weight: 800; margin: 8px 0; }
  </style>
</head>
<body>
<div class="container">

  <!-- FORM SCREEN -->
  <div id="screen-form" class="screen active">
    <h2>Pay with M-Pesa</h2>

    <label for="phone">Phone number</label>
    <input type="tel" id="phone" placeholder="0712345678" value="0712345678">

    <label for="amount">Amount (KSh)</label>
    <input type="number" id="amount" placeholder="200" value="200">

    <label for="reference">Reference (optional)</label>
    <input type="text" id="reference" placeholder="ORDER-123" value="">

    <button id="sendBtn">Pay Now</button>
  </div>

  <!-- WAITING SCREEN -->
  <div id="screen-waiting" class="screen">
    <h2>Check your phone</h2>
    <div class="spinner"></div>
    <p class="sub">Enter your M-Pesa PIN to complete the payment of<br><strong id="waitingAmount"></strong></p>
  </div>

  <!-- SUCCESS SCREEN -->
  <div id="screen-success" class="screen">
    <div class="icon-circle icon-success">✓</div>
    <h2>Payment Successful</h2>
    <div class="amount" id="successAmount"></div>
    <p class="sub" id="successRef"></p>
  </div>

  <!-- FAILURE SCREEN -->
  <div id="screen-failure" class="screen">
    <div class="icon-circle icon-fail">✕</div>
    <h2>Payment Not Completed</h2>
    <p class="sub">The payment wasn't completed. You can try again.</p>
    <button id="retryBtn">Try Again</button>
  </div>

</div>

<script>
  (function() {
    const screens = {
      form: document.getElementById('screen-form'),
      waiting: document.getElementById('screen-waiting'),
      success: document.getElementById('screen-success'),
      failure: document.getElementById('screen-failure')
    };

    function showScreen(name) {
      Object.values(screens).forEach(s => s.classList.remove('active'));
      screens[name].classList.add('active');
    }

    const phoneInput = document.getElementById('phone');
    const amountInput = document.getElementById('amount');
    const referenceInput = document.getElementById('reference');
    const sendBtn = document.getElementById('sendBtn');
    const retryBtn = document.getElementById('retryBtn');

    function normalizePhone(raw) {
      let p = raw.replace(/\s+/g, '');
      if (p.startsWith('0')) p = '254' + p.slice(1);
      if (p.startsWith('+')) p = p.slice(1);
      return p;
    }

    // Poll every 3s, give up after ~90s (30 attempts) — customer never sees these details,
    // just the "check your phone" spinner the whole time.
    const POLL_INTERVAL_MS = 3000;
    const MAX_ATTEMPTS = 30;

    async function pollStatus(transactionId, amount, reference) {
      for (let attempt = 0; attempt < MAX_ATTEMPTS; attempt++) {
        await new Promise(r => setTimeout(r, POLL_INTERVAL_MS));

        try {
          const res = await fetch(`/api/status?transactionId=${encodeURIComponent(transactionId)}`);
          if (!res.ok) continue; // transient error — just keep polling silently

          const data = await res.json();
          const status = data.status;

          if (status === 'COMPLETED') {
            document.getElementById('successAmount').textContent = `KSh ${amount}`;
            document.getElementById('successRef').textContent = reference ? `Ref: ${reference}` : '';
            showScreen('success');
            return;
          }

          if (status === 'FAILED' || status === 'CANCELLED' || status === 'REJECTED') {
            showScreen('failure');
            return;
          }

          // Anything else (PENDING, etc.) — keep waiting silently.
        } catch (e) {
          // Network hiccup — keep polling silently, don't alarm the customer.
        }
      }

      // Exhausted attempts with no final status — treat as not completed.
      showScreen('failure');
    }

    async function startPayment() {
      const phone = phoneInput.value.trim();
      const amount = amountInput.value.trim();
      const reference = referenceInput.value.trim() || ('ORDER-' + Date.now());

      if (!phone || !amount) return;

      sendBtn.disabled = true;
      document.getElementById('waitingAmount').textContent = `KSh ${amount}`;
      showScreen('waiting');

      try {
        const response = await fetch('/api/stk-push', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            phone: normalizePhone(phone),
            amount: parseInt(amount, 10),
            reference,
            description: 'Payment'
          })
        });

        const data = await response.json().catch(() => null);

        if (!response.ok || !data || !data.transactionId) {
          showScreen('failure');
          return;
        }

        pollStatus(data.transactionId, amount, reference);
      } catch (e) {
        showScreen('failure');
      } finally {
        sendBtn.disabled = false;
      }
    }

    sendBtn.addEventListener('click', startPayment);
    retryBtn.addEventListener('click', () => showScreen('form'));
  })();
</script>
</body>
</html>
